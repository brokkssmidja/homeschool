<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Inga’s chess</title>
  <meta name="theme-color" content="#f7f1e7">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="vendor/chessground.base.css">
  <link rel="stylesheet" href="vendor/chessground.brown.css">
  <link rel="stylesheet" href="vendor/chessground.cburnett.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view-list" class="view"></main>
  <main id="view-play" class="view" hidden></main>
  <main id="view-check" class="view" hidden></main>
  <dialog id="reset-all" aria-labelledby="reset-all-title">
    <h2 id="reset-all-title">Reset all chess progress?</h2>
    <p>This clears every page’s score on this device.</p>
    <button type="button" class="hold" id="reset-hold"><span>Hold to reset</span></button>
    <button type="button" class="go" id="reset-cancel" autofocus>Keep my scores</button>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
